# The URL the site will be built for
base_url = "https://mmestiyak.com"

# The title of your site
title = "Meer's Log"

# The description of your site
description = "The logbook of Meer Estiyak — software, farming, cycling, and fighting, from Bangladesh."

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

# Whether to generate feeds
generate_feeds = true

# The taxonomies to be rendered for the site
taxonomies = [
    { name = "tags" },
    { name = "topics" }
]

# Default language for search indexing (important for non-English content)
default_language = "en"

# Search configuration
[search]
index_format = "elasticlunr_javascript"

[markdown]
# Syntax highlighting — enabled by default
render_emoji = true
bottom_footnotes = true
github_alerts = true

[extra]
# SEO and social media
author = "Meer Estiyak"
keywords = [
    "Meer Estiyak",
    "meer estiyak",
    "mmestiyak",
    "teammeer",
    "software development",
    "programming",
    "technology",
    "cycling",
    "MMA",
    "boxing",
    "cattle farming",
    "silage",
    "Kommercly",
    "Bangladesh",
    "personal blog"
]
twitter = "mmestiyak"
github = "mmestiyak"
linkedin = "mmestiyak"
email = "mmestiyak@gmail.com"

# Optional: alternate names for SEO/entity matching
aliases = ["Meer Estiyak", "mmestiyak", "teammeer"]

# Portrait shown on home + about once set (e.g. "/images/portrait.jpg" after
# dropping portrait.jpg into static/images/). Empty = hidden.
portrait = ""

# Photo strip on the about page (e.g. ["/images/farm.jpg", "/images/ride.jpg"]).
# Empty = hidden.
about_photos = []

# Google Analytics 4
google_analytics = "G-33V0WBXVRM"

# Analytics (add your tracking ID)
# google_analytics = "GA_TRACKING_ID"

# Open Graph
og_image = "https://mmestiyak.com/og-image.jpg"
og_type = "website"
og_locale = "en_US"

# Additional SEO
canonical_url = "https://mmestiyak.com"
