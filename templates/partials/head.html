<!-- Typography: Newsreader + Noto Serif Bengali, self-hosted (no external requests).
     Tokens live in tailwind.config.js; after editing template classes run: make css -->
<link rel="stylesheet" href="{{ get_url(path="fonts/fonts.css") }}">
<link rel="stylesheet" href="{{ get_url(path="tailwind.css") }}">

<!-- Zola's built-in search -->
<script src="{{ get_url(path="elasticlunr.min.js") }}"></script>
<script src="{{ get_url(path="search_index.en.js") }}"></script>

<!-- Custom CSS for additional styling -->
<link rel="stylesheet" href="{{ get_url(path="style.css") }}">

{% if config.generate_feeds %}
    <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ get_url(path="atom.xml") }}">
{% endif %}
{% if config.extra.google_analytics %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ config.extra.google_analytics }}"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', '{{ config.extra.google_analytics }}');
</script>
{% endif %}
