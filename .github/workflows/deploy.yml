name: Build and deploy GH Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write        # needed to push the built site to gh-pages

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Pinned so a Hugo release can never break a deploy unannounced.
      # Keep this equal to the Hugo you develop on (`hugo version`), when the
      # two drift you are no longer testing what you deploy. Bumping this and
      # the `locale` key in hugo.toml are a single change: `locale` replaced the
      # deprecated `languageCode` in 0.158, so an older pin cannot parse it.
      HUGO_VERSION: 0.165.0
      PAGES_BRANCH: gh-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo (extended, required for WebP image processing)
        run: |
          curl -sLo hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --gc --baseURL "https://mmestiyak.com/"

      - name: Sanity-check the build before publishing
        run: |
          test -s public/index.html
          test -s public/CNAME
          test -f public/.nojekyll
          test -s public/atom.xml
          test -s public/archive/index.html
          test -s public/moments/index.html
          grep -q '<article' public/logs/index.html               # log list rendered
          test -s public/work/index.html                            # work page present
          test -s public/resume/index.html                           # resume route present
          grep -q 'JoulesLabs' public/resume/index.html              # resume rendered from content/experience
          grep -q '<img' public/index.html                           # portrait actually shipped
          test -s public/og-image.jpg                               # social card ships
          test -s public/favicon.svg                                # tab icon ships
          grep -q 'href=/css/tailwind\.' public/index.html         # fingerprinted css linked
          test -n "$(find public -name '*.html' -newermt '-1 hour' -print -quit)"
          echo "build looks sane"

      - name: Publish to ${{ env.PAGES_BRANCH }}
        run: |
          cd public
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}: ${GITHUB_WORKFLOW}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${PAGES_BRANCH}
          echo "published to ${PAGES_BRANCH}"
