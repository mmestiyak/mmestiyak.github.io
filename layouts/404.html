{{ define "main" }}
<div class="max-w-2xl mx-auto px-4 sm:px-6 py-20 sm:py-28 text-center">
    <p class="label text-faded mb-3">404</p>
    <h1 class="display text-3xl sm:text-4xl font-semibold text-ink mb-4">This page isn't in the log.</h1>
    <p class="text-base sm:text-lg text-faded mb-8">The link may be old, or the entry may never have existed.</p>
    <div class="flex flex-wrap items-center justify-center gap-5 font-serif text-sm">
        <a href="{{ "/" | relURL }}" class="px-4 py-2 bg-ink text-paper rounded-sm hover:bg-accent transition-colors">home</a>
        <a href="{{ "/archive/" | relURL }}" class="text-faded underline underline-offset-4 hover:text-accent transition-colors">archive</a>
        <a href="{{ "/logs/" | relURL }}" class="text-faded underline underline-offset-4 hover:text-accent transition-colors">logs</a>
    </div>
</div>
{{ end }}
